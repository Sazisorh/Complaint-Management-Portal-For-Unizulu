<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - UNIZULU Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-page auth-register">
    <div class="card">
        <h2>Register Account</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label>Full Name and Surname</label>
                <input type="text" name="full_name" required placeholder="Enter your name and surname">
            </div>
            <div class="form-group">
                <label for="register-username">9-digit ID</label>
                <input id="register-username" type="text" name="username" required placeholder="Enter your 9-digit ID starting with 20" pattern="20[0-9]{7}" maxlength="9" title="ID must match the selected role and contain exactly 9 digits."
                    inputmode="numeric">
            </div>
            <div class="form-group">
                <label for="email">Email address for updates</label>
                <input type="email" name="email" id="email" required maxlength="254" autocomplete="email" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="register-role">Account Type</label>
                <select id="register-role" name="role" required>
                    <option value="" selected disabled>Select Role</option>
                    <option value="student">Student</option>
                    <option value="staff">Staff Member</option>
                    <option value="admin">System Administrator</option>
                </select>
            </div>
            <div class="form-group is-hidden" id="register-department-group">
                <label for="register-department">Department</label>
                <select id="register-department" name="department">
                    <option value="" selected disabled>Select Department</option>
                    {% for department in departments %}
                    <option value="{{ department }}">{{ department }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn">Register</button>
        </form>
        <script src="{{ url_for('static', filename='js/register.js') }}" defer></script>
        <script src="{{ url_for('static', filename='js/password_toggle.js') }}" defer></script>
        <div class="links">
            <a href="{{ url_for('login') }}">Back to Login</a>
        </div>
    </div>
</body>
</html>
